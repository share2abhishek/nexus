# Every push to master: run the tests, then deploy to production (nexus.radixile.com on EC2).
# The deploy step uses this repository's Pipelines SSH key (Repository settings → Pipelines →
# SSH keys). On the server that key may only run scripts/deploy/nexus-deploy.sh (forced
# command), which backs up, rebuilds the Docker image, health-checks and rolls back on failure.

image: atlassian/default-image:4

pipelines:
  branches:
    master:
      - step:
          name: Tests
          image: node:20
          caches:
            - node
          script:
            - export ELECTRON_SKIP_BINARY_DOWNLOAD=1
            - npm ci
            - npm test
      - step:
          name: Deploy to production (EC2)
          deployment: production
          clone:
            depth: full
          script:
            - export DEPLOY_HOST=ec2-user@ec2-13-235-255-185.ap-south-1.compute.amazonaws.com
            - mkdir -p ~/.ssh
            - echo "ec2-13-235-255-185.ap-south-1.compute.amazonaws.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMqjZ2gEcOP5i/lAcCQi+0YbjGuo5P3NQryaxnHgvivF" >> ~/.ssh/known_hosts
            - SERVER_HEAD=$(ssh "$DEPLOY_HOST" head)
            - echo "Server is on $SERVER_HEAD, deploying $BITBUCKET_COMMIT"
            - git branch -f deploy "$BITBUCKET_COMMIT"
            - |
              if [ "$SERVER_HEAD" = "$BITBUCKET_COMMIT" ]; then
                ssh "$DEPLOY_HOST" "deploy $BITBUCKET_COMMIT" < /dev/null
              else
                git cat-file -e "$SERVER_HEAD^{commit}" || { echo "Server commit $SERVER_HEAD is not in this repository (made on the server?). Deploy by hand."; exit 1; }
                git bundle create /tmp/deploy.bundle "$SERVER_HEAD..deploy"
                ssh "$DEPLOY_HOST" "deploy $BITBUCKET_COMMIT" < /tmp/deploy.bundle
              fi
