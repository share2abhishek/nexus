[project]
name = "voice-gateway"
version = "0.1.0"
description = "Nexus AI voice assistant gateway: WhatsApp call audio (WebRTC) and the turn loop (speech-to-text, AI reply, voice) through provider APIs"
requires-python = ">=3.11"
dependencies = [
  "aiortc>=1.9",
  "aiohttp>=3.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "webrtcvad-wheels>=2.0.14",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
