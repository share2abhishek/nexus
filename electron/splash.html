<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; overflow: hidden;
    }
    .card {
      background: #080c14;
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 20px;
      width: 420px; height: 280px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.8), 0 0 60px rgba(124,58,237,0.15);
      padding: 32px;
    }
    .logo { display:flex; align-items:center; gap:12px; }
    .logo img { width:48px; height:48px; border-radius:12px; }
    .logo-text {
      font-size: 30px; font-weight: 900; letter-spacing: -0.5px;
      background: linear-gradient(135deg,#7c3aed,#3b82f6,#06b6d4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .status { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .progress-bar {
      width: 260px; height: 3px;
      background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg,#7c3aed,#3b82f6,#06b6d4);
      animation: load 2.5s ease-in-out infinite;
    }
    @keyframes load {
      0%   { width: 0%;   margin-left: 0; }
      50%  { width: 80%;  margin-left: 10%; }
      100% { width: 0%;   margin-left: 100%; }
    }
    .dots span {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #7c3aed; margin: 0 3px;
      animation: bounce 1.2s ease infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; background: #3b82f6; }
    .dots span:nth-child(3) { animation-delay: 0.4s; background: #06b6d4; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    .version { font-size: 11px; color: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="../public/icon.svg" alt="NEXUS" onerror="this.style.display='none'" />
      <span class="logo-text">NEXUS</span>
    </div>
    <p class="status">Starting AI Marketing Platform…</p>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div class="dots"><span></span><span></span><span></span></div>
    <span class="version">v2.0 — AI Digital Marketing Suite</span>
  </div>
</body>
</html>
